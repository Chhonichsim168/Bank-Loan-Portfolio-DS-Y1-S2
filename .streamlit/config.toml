# Credit Desk theme. These are Streamlit's own theme hooks; the full design system lives
# in src/ui.py and docs/design_system.md.
[theme]
primaryColor = "#0B6B62"
backgroundColor = "#F3F5F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"
font = "sans serif"

[server]
headless = true
# No fixed address here, so a hosting service (Streamlit Community Cloud, Render, Docker) can
# serve the app. On your own computer the START file / launch.py binds it to this computer only
# (--server.address 127.0.0.1). Behind your own server, see deploy/nginx.conf.example.
enableXsrfProtection = true
enableCORS = true
# Supporting documents are limited to 10 MB each (src/documents.py); the upload box says so too.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
